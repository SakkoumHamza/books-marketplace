<div class="container">
  <div class="row">
    <div class="col-lg-12 mb-2 ">
      <div class="form-group">
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fa fa-search"></i></span>
          </div>
          <input type="text" class="form-control" placeholder="Search" [(ngModel)]="keyword">
          <button class="btn btn-primary search-btn" (click)="searchBook()">Search</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid">
  <div class="row">
    @for (book of books; track book.id)
      {<div class="col-lg-2" >
        <div class="card" >
          <img class="card-img-top" src="{{book.cover}}" alt="Card image cap">
          <div class="card-body">
            <h5 class="card-title">{{book.title}}</h5>
            <p class="card-text">{{book.description}}</p>
            <a [routerLink]="['/books', book.id]" class="btn btn-primary">
              <i class="fa fa-eye"></i> View
            </a>
          </div>
        </div>
      </div>}
  </div>
</div>
